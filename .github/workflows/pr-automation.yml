name: PR automation

# pull_request_target so labels work on fork PRs. Safe because this workflow
# never checks out or runs PR code: it only calls the GitHub API.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]

permissions: {}

concurrency:
  group: pr-automation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    name: Size label
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ignore = [
              /(^|\/)pnpm-lock\.yaml$/, /(^|\/)uv\.lock$/, /\.lock$/,
              /(^|\/)drizzle\/meta\//, /\.snap$/, /\.min\.(js|css)$/,
            ];
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: context.issue.number, per_page: 100,
            });
            const lines = files
              .filter(f => !ignore.some(re => re.test(f.filename)))
              .reduce((n, f) => n + f.additions + f.deletions, 0);
            const tiers = [[10, 'XS'], [50, 'S'], [200, 'M'], [500, 'L'], [1000, 'XL']];
            const size = (tiers.find(([max]) => lines < max) || [0, 'XXL'])[1];
            const want = `size/${size}`;
            const current = (await github.paginate(github.rest.issues.listLabelsOnIssue, {
              ...context.repo, issue_number: context.issue.number,
            })).map(l => l.name);
            for (const name of current.filter(n => n.startsWith('size/') && n !== want)) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: context.issue.number, name });
            }
            if (!current.includes(want)) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels: [want] });
            }
            core.info(`${lines} changed lines (lockfiles/generated excluded) -> ${want}`);
            if (size === 'XL' || size === 'XXL') {
              core.warning(`PR is ${size}. Trunk-based flow aims for under ~300 changed lines; consider splitting.`);
            }

  area:
    name: Area labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  title:
    name: Title check and type label
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            perf
            ci
            chore
            style
            build
            revert
          requireScope: false

      - name: Apply type label
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            const m = /^(\w+)(\([^)]*\))?(!)?:/.exec(process.env.PR_TITLE || '');
            const labels = [];
            if (m) {
              labels.push(`type: ${m[1]}`);
              if (m[3]) labels.push('breaking change');
            }
            const current = (await github.paginate(github.rest.issues.listLabelsOnIssue, {
              ...context.repo, issue_number: context.issue.number,
            })).map(l => l.name);
            // Labels this step owns: drop any the current title no longer earns.
            const owned = n => n.startsWith('type: ') || n === 'breaking change';
            for (const name of current.filter(n => owned(n) && !labels.includes(n))) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: context.issue.number, name });
            }
            const add = labels.filter(l => !current.includes(l));
            if (add.length) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels: add });
            }

  housekeeping:
    name: Assignee and draft state
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.assignees.length === 0 && pr.user.type === 'User') {
              await github.rest.issues.addAssignees({
                ...context.repo, issue_number: pr.number, assignees: [pr.user.login],
              });
            }
            const names = (await github.paginate(github.rest.issues.listLabelsOnIssue, {
              ...context.repo, issue_number: pr.number,
            })).map(l => l.name);
            const wantWip = pr.draft;
            if (wantWip && !names.includes('work in progress')) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: ['work in progress'] });
            } else if (!wantWip && names.includes('work in progress')) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name: 'work in progress' });
            }
            if (!wantWip && !names.includes('needs-review')) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: ['needs-review'] });
            } else if (wantWip && names.includes('needs-review')) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name: 'needs-review' });
            }

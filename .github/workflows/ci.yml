name: CI
run-name: >-
  ${{ github.event_name == 'pull_request'
  && format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title)
  || format('Production · {0}', github.event.head_commit.message) }}

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# CPU runners use the bundled ONNX Runtime binaries for the repo index.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

# Superseded PR runs are cancelled; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job starts at once: each is a required check on its own, and waiting for `lint` first only added its
# runtime to the critical path. A slow job is fixed in its own steps, not by serialising the others.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo run lint

      - run: pnpm run lint:types

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/engine/uv.lock

      - run: uv sync --frozen --no-build --python 3.12
        working-directory: services/engine

      - run: uv run ruff check learnquest_engine tests scripts
        working-directory: services/engine

      - run: uv run mypy --strict learnquest_engine
        working-directory: services/engine

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      coverage: ${{ steps.coverage.outputs.result }}
    env:
      TEST_DATABASE_URL: postgres://learnquest:learnquest@localhost:5432/learnquest_test
      BETTER_AUTH_SECRET: ci-test-secret-not-for-production-0123456789
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: learnquest
          POSTGRES_PASSWORD: learnquest
          POSTGRES_DB: learnquest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnquest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run tests and build
        run: pnpm exec turbo run test build
        env:
          ISOLATE_API_TEST_DATABASES: "true"
          API_COVERAGE_FILE: ${{ runner.temp }}/api-coverage.lcov

      - run: pnpm run test:scripts

      - name: Report API coverage
        id: coverage
        if: ${{ !cancelled() }}
        env:
          API_COVERAGE_FILE: ${{ runner.temp }}/api-coverage.lcov
        run: |
          if [[ -s "$API_COVERAGE_FILE" ]]; then
            awk -F: '
              $1 == "LF" { lines += $2 }
              $1 == "LH" { coveredLines += $2 }
              $1 == "BRF" { branches += $2 }
              $1 == "BRH" { coveredBranches += $2 }
              END {
                if (lines && branches)
                  printf "result=API coverage: %.1f%% lines, %.1f%% branches\n", 100 * coveredLines / lines, 100 * coveredBranches / branches
              }
            ' "$API_COVERAGE_FILE" >> "$GITHUB_OUTPUT"
          fi

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/engine/uv.lock

      # The visual checker runs ui-catalog's TypeScript under Node 22 (type stripping), so it needs node and its deps.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @learnquest/ui-catalog...
        working-directory: .

      - run: uv sync --frozen --no-build --python 3.12

      - run: uv run pytest

      # Checks the version the engine actually ships (its exact pin in pyproject.toml), not a copy that can drift.
      - name: Advisory check (pinned LiteLLM version is not compromised)
        working-directory: .
        run: |
          v=$(sed -nE 's/^ *"litellm==([^"]+)".*/\1/p' services/engine/pyproject.toml)
          test -n "$v" || { echo "no exact litellm== pin in services/engine/pyproject.toml"; exit 1; }
          python3 spikes/litellm-advisory/check.py "$v"

  # The production deploy's shell tooling: the head-of-main guard, Render hook call, Vercel config rewrite, smoke gate,
  # and the workflow's own structure. Nothing else runs these, so a regression would only show on a real deploy.
  deploy-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - run: |
          scripts/smoke.test.sh
          scripts/assert-main-head.test.sh
          scripts/render-deploy.test.sh
          scripts/render-vercel-config.test.sh
          scripts/deploy-production.test.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      test_result: ${{ steps.results.outputs.result }}
      report_url: ${{ steps.report.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build API and engine images in parallel
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: infra/docker/e2e.hcl
          load: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # --with-deps pulls OS packages from the runner's Ubuntu mirror, which can fail to resolve. Only this install is
      # retried. A failed test is never retried.
      - name: Install Playwright Chromium
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @learnquest/e2e --fail-if-no-match exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright install failed (attempt $attempt of 3), retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Run browser tests against Compose
        run: pnpm --filter @learnquest/e2e --fail-if-no-match run ci
        env:
          E2E_PREBUILT: "1"
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/playwright-results.json

      - name: Report browser test results
        id: results
        if: ${{ !cancelled() }}
        run: |
          results="$RUNNER_TEMP/playwright-results.json"
          if [[ -s "$results" ]]; then
            jq -r '.stats | "result=\(.expected) passed, \(.unexpected) failed, \(.flaky) flaky, \(.skipped) skipped"' "$results" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright report
        id: report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-report-attempt-${{ github.run_attempt }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy-production:
    name: Prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, unit, engine, deploy-scripts, e2e]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit

  summary:
    name: Summary
    if: ${{ !cancelled() }}
    needs: [lint, unit, engine, deploy-scripts, e2e, deploy-production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Summarize checks and deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_COVERAGE: ${{ needs.unit.outputs.coverage }}
          E2E_RESULT: ${{ needs.e2e.outputs.test_result }}
          E2E_REPORT_URL: ${{ needs.e2e.outputs.report_url }}
          PRODUCTION_RESULT: ${{ needs.deploy-production.result }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" --jq '.jobs[]' |
            jq -s '.' |
            node scripts/ci-summary.ts >> "$GITHUB_STEP_SUMMARY"

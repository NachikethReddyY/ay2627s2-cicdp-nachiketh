name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR runs are cancelled; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job starts at once: each is a required check on its own, and waiting for `lint` first only added its
# runtime to the critical path. A slow job is fixed in its own steps, not by serialising the others.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo run lint

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/engine/uv.lock

      - run: uv sync --frozen --no-build --python 3.12
        working-directory: services/engine

      - run: uv run ruff check learnquest_engine tests scripts
        working-directory: services/engine

      - run: uv run mypy --strict learnquest_engine
        working-directory: services/engine

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgres://learnquest:learnquest@localhost:5432/learnquest_test
      BETTER_AUTH_SECRET: ci-test-secret-not-for-production-0123456789
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: learnquest
          POSTGRES_PASSWORD: learnquest
          POSTGRES_DB: learnquest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnquest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo run test build

      - run: pnpm run test:scripts

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/engine/uv.lock

      # The visual checker runs ui-catalog's TypeScript under Node 22 (type stripping), so it needs node and its deps.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @learnquest/ui-catalog...
        working-directory: .

      - run: uv sync --frozen --no-build --python 3.12

      - run: uv run pytest

      # Checks the version the engine actually ships (its exact pin in pyproject.toml), not a copy that can drift.
      - name: Advisory check (pinned LiteLLM version is not compromised)
        working-directory: .
        run: |
          v=$(sed -nE 's/^ *"litellm==([^"]+)".*/\1/p' services/engine/pyproject.toml)
          test -n "$v" || { echo "no exact litellm== pin in services/engine/pyproject.toml"; exit 1; }
          python3 spikes/litellm-advisory/check.py "$v"

  # The production deploy's shell tooling: the head-of-main guard, Render hook call, Vercel config rewrite, smoke gate,
  # and the workflow's own structure. Nothing else runs these, so a regression would only show on a real deploy.
  deploy-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - run: |
          scripts/smoke.test.sh
          scripts/assert-main-head.test.sh
          scripts/render-deploy.test.sh
          scripts/render-vercel-config.test.sh
          scripts/deploy-production.test.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each service image is built here, once, with its own GitHub cache scope, so an unchanged dependency layer
      # is reused. scripts/ci.sh starts these images without building again (E2E_PREBUILT).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/api.Dockerfile
          tags: learnquest-ci-api:e2e
          load: true
          cache-from: type=gha,scope=e2e-api
          cache-to: type=gha,mode=max,scope=e2e-api

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/engine/Dockerfile
          tags: learnquest-ci-engine:e2e
          load: true
          cache-from: type=gha,scope=e2e-engine
          cache-to: type=gha,mode=max,scope=e2e-engine

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm --filter @learnquest/e2e --fail-if-no-match exec playwright install --with-deps chromium

      - run: pnpm --filter @learnquest/e2e --fail-if-no-match run ci
        env:
          E2E_PREBUILT: "1"

      # Keeps the Playwright report and traces from a red run, so a failure can be read without rerunning.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

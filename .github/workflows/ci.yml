name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://learnquest:learnquest@localhost:5432/learnquest_test
      BETTER_AUTH_SECRET: ci-test-secret-not-for-production-0123456789
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: learnquest
          POSTGRES_PASSWORD: learnquest
          POSTGRES_DB: learnquest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnquest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo run lint test build

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      # The visual checker runs ui-catalog's TypeScript under Node 22 (type stripping), so it needs node and its deps.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile --filter @learnquest/ui-catalog...
        working-directory: .

      - run: uv sync --frozen

      - run: uv run ruff check learnquest_engine tests scripts

      - run: uv run mypy --strict learnquest_engine

      - run: uv run pytest

      - name: Advisory check (pinned LiteLLM version is not compromised)
        working-directory: .
        run: python3 spikes/litellm-advisory/check.py 1.106.2
